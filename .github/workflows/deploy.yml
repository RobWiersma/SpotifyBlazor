# Builds and deploys the app to Azure App Service on every push to main that
# changes the app. Logs in to Azure with OIDC: no password or publish profile is
# stored anywhere (see infra/github and infra/README.md, "CI").
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "SpotifyBlazor/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "SpotifyBlazor/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits rather than racing an older one
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs on pull requests too, so a change that doesn't build shows up before merging
  build:
    name: build + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: dotnet publish
        run: dotnet publish SpotifyBlazor/Server/SpotifyBlazor.Server.csproj -c Release -o publish

      - name: Download size
        run: |
          {
            echo "### Browser download (Brotli)"
            echo '```'
            du -ch publish/wwwroot/_framework/*.br | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: publish
          retention-days: 7

  deploy:
    name: deploy to Azure
    needs: build
    # Only main deploys, and only once the identity from infra/github exists
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_CLIENT_ID != ''
    runs-on: ubuntu-latest
    # Azure trusts this job's token only because it runs in this environment
    environment:
      name: production
      url: https://spotifyblazor.bswiersma.com
    permissions:
      contents: read
      id-token: write # lets the job request an OIDC token for Azure login
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: publish

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish

      # The app answers on the public address after the restart
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null https://spotifyblazor.bswiersma.com/api/config; then
              echo "Live"; exit 0
            fi
            sleep 10
          done
          echo "The site didn't answer after the deploy" >&2
          exit 1
