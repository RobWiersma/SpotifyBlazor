<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpotifyBlazor – Spotify player with live audio visualizers</title>
    <base href="/" />

    <!-- Search engines and link previews (Google, Discord, Slack, X, LinkedIn...).
         Each page's canonical URL is added by MainLayout -->
    <meta name="description" content="A Spotify web player built with Blazor WebAssembly and .NET 8: search, albums, playlists, liked songs and live audio visualizers. Try the demo with free music, no account needed." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SpotifyBlazor" />
    <meta property="og:title" content="SpotifyBlazor – Spotify player with live audio visualizers" />
    <meta property="og:description" content="A Spotify web player built with Blazor WebAssembly and .NET 8. Try the demo with free music, no account needed." />
    <meta property="og:url" content="https://spotifyblazor.bswiersma.com/" />
    <meta property="og:image" content="https://spotifyblazor.bswiersma.com/social-preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SpotifyBlazor logo and name" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#111318" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <!-- ?v= forces browsers holding an old cached copy to fetch the new file -->
    <link rel="stylesheet" href="css/app.css?v=3" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="css/SpotifyBlazor.styles.css?v=2" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <!-- Shown until Blazor finishes downloading and replaces it -->
        <div class="app-loading">
            <div class="app-loading-spinner"></div>
            <div>Loading SpotifyBlazor…</div>
        </div>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="loggingInterop.js"></script>
    <script src="devicepicker.js"></script>
</body>

</html>
