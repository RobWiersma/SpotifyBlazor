<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpotifyBlazor</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <!-- ?v= forces browsers holding an old cached copy to fetch the new file -->
    <link rel="stylesheet" href="css/app.css?v=2" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="css/SpotifyBlazor.styles.css?v=2" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <!-- Shown until Blazor finishes downloading and replaces it -->
        <div class="app-loading">
            <div class="app-loading-spinner"></div>
            <div>Loading SpotifyBlazor…</div>
        </div>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="loggingInterop.js"></script>
    <script src="devicepicker.js"></script>
</body>

</html>
